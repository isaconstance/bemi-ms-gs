spring.application.name=ms-alerta

spring.profiles.active=dev
spring.jpa.open-in-view=false

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

server.port=0

eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${random.uuid}

#Circuit Breaker: monitora as últimas 3 chamadas
resilience4j.circuitbreaker.instances.atualizarIdoso.slidingWindowSize=3

# Tipo da janela: por quantidade de chamadas
resilience4j.circuitbreaker.instances.atualizarIdoso.slidingWindowType=COUNT_BASED

# Só começa a calcular taxa de falha após pelo menos 2 chamadas
resilience4j.circuitbreaker.instances.atualizarIdoso.minimumNumberOfCalls=2

# Abre o circuito quando a taxa de falhas atingir 50%
resilience4j.circuitbreaker.instances.atualizarIdoso.failureRateThreshold=50

# Tempo que o circuito permanece OPEN antes de ir para HALF_OPEN
resilience4j.circuitbreaker.instances.atualizarIdoso.waitDurationInOpenState=50s

# Em HALF_OPEN, permite 2 chamadas de teste
resilience4j.circuitbreaker.instances.atualizarIdoso.permittedNumberOfCallsInHalfOpenState=2

# Habilita o Circuit Breaker nas chamadas OpenFeign
spring.cloud.openfeign.circuitbreaker.enabled=true

